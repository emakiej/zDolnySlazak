<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizy o krajach anglojęzycznych</title>
<style>
:root{color-scheme:light;--bg:#eeeee8;--card:#fafaf6;--ink:#293631;--muted:#5a6861;--line:#cbd1c9;--accent:#365b50}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:820px;margin:40px auto;padding:0 20px}
header{margin-bottom:22px}
h1{font-size:29px;line-height:1.3;margin:0}
header p{color:var(--muted);margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 3px 18px #24362a08}
h2{font-size:23px;line-height:1.4;margin:0 0 22px}
nav{display:grid;gap:12px}
.quiz-link{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:16px 18px;border:1px solid var(--line);border-radius:9px;background:#fffefa;color:var(--ink);text-decoration:none}
.quiz-link:hover{background:#e4eae2;border-color:#879c8e}
.quiz-link:focus-visible{outline:3px solid #547e71;outline-offset:3px}
.country{font-weight:650}
.action{font-size:15px;color:var(--accent);white-space:nowrap}
.note{color:var(--muted);font-size:15px;margin:22px 0 0}
@media(max-width:560px){main{margin:22px auto;padding:0 12px}.card{padding:20px}h1{font-size:25px}h2{font-size:21px}.quiz-link{padding:14px}.action{font-size:14px}}
@media(max-width:340px){.quiz-link{align-items:flex-start;flex-direction:column;gap:4px}}
</style>
</head>
<body>
<main>
<header>
<h1>Quizy o krajach anglojęzycznych</h1>
<p>Przygotowanie do konkursu z języka angielskiego</p>
</header>
<section class="card" aria-labelledby="choose-title">
<h2 id="choose-title">Wybierz kraj</h2>
<nav aria-label="Wybór quizu">
<a class="quiz-link" href="Australia_quiz.html"><span class="country">Australia</span><span class="action">Rozpocznij quiz <span aria-hidden="true">→</span></span></a>
<a class="quiz-link" href="Kanada_quiz.html"><span class="country">Kanada</span><span class="action">Rozpocznij quiz <span aria-hidden="true">→</span></span></a>
<a class="quiz-link" href="Nowa_Zelandia_quiz.html"><span class="country">Nowa Zelandia</span><span class="action">Rozpocznij quiz <span aria-hidden="true">→</span></span></a>
<a class="quiz-link" href="quiz-USA.html"><span class="country">Stany Zjednoczone</span><span class="action">Rozpocznij quiz <span aria-hidden="true">→</span></span></a>
</nav>
<p class="note">Pytania są po angielsku. Wybierz quiz, aby rozpocząć naukę.</p>
</section>
</main>
</body>
</html>
