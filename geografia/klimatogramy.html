<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klimatogramy ZPE — quiz</title><style>:root{--ink:#172433;--blue:#2378c9;--red:#d83b47;--ok:#117a43;--bad:#b42332}*{box-sizing:border-box}body{margin:0;background:#f4f8fb;color:var(--ink);font:16px/1.45 system-ui,Arial,sans-serif}main{max-width:940px;margin:auto;padding:25px 15px 50px}h1{margin:0 0 5px}.intro,.card{background:#fff;border:1px solid #dbe5ee;border-radius:14px;padding:17px;margin:16px 0}.card{box-shadow:0 2px 7px #1122330d}.top{display:flex;justify-content:space-between;gap:10px}.badge{background:#e6f1ff;color:#155b9e;border-radius:20px;padding:3px 10px;font-weight:700}svg{width:100%;display:block;margin:12px 0;border:1px solid #dce6ee;border-radius:9px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.answers button{font:inherit;text-align:left;padding:9px;border:1px solid #c7d3df;border-radius:8px;background:white;cursor:pointer}.answers button:hover{background:#eef6ff}.correct{background:#e7f7ed!important;border-color:var(--ok)!important}.wrong{background:#ffedf0!important;border-color:var(--bad)!important}.features{margin-top:13px;padding:12px;border:1px solid #d8e2eb;border-radius:9px;background:#fbfdff}.hidden{display:none}.feature-grid{display:grid;gap:5px}.feature-grid label{padding:6px;border-radius:6px}.feature-grid label:hover{background:#edf5ff}.feature-ok{background:#e7f7ed}.feature-bad{background:#ffedf0}.check,#finish{margin-top:10px;padding:9px 13px;border:0;border-radius:8px;background:#175fa8;color:white;font:600 15px inherit;cursor:pointer}.check:disabled,#finish:disabled{opacity:.45}.feedback{font-weight:600;margin-top:8px;min-height:1.4em}.result{padding:15px;background:#eaf5ff;border-left:5px solid var(--blue);border-radius:8px;margin-top:18px}@media(max-width:620px){.answers{grid-template-columns:1fr}}</style></head><body><main><h1>Quiz: klimatogram → typ klimatu</h1><p class="intro">Wszystkie klimatogramy odpowiadają przykładom z materiału ZPE. Najpierw wybierz typ klimatu, potem zaznacz <strong>wszystkie</strong> cechy wykresu, które uzasadniają wybór.</p><div id="quiz"></div><button id="finish" disabled>Sprawdź wynik odpowiedzi</button><div id="result" class="hidden"></div></main><script>const quiz=[{"place": "Iquitos, Peru", "answer": "równikowy wybitnie wilgotny", "t": [28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28], "p": [240, 245, 295, 280, 275, 200, 180, 180, 220, 210, 260, 265], "features": ["Temperatura przez cały rok przekracza 20°C.", "Roczna amplituda temperatury jest bardzo mała.", "W każdym miesiącu występują wysokie opady, bez pory suchej."]}, {"place": "Jaunde, Kamerun", "answer": "podrównikowy wilgotny", "t": [24, 25, 25, 24, 23, 22, 22, 22, 23, 24, 25, 24], "p": [25, 55, 145, 180, 220, 155, 70, 100, 255, 300, 120, 25], "features": ["Temperatura przez cały rok przekracza 20°C.", "Opady tworzą pory deszczowe, ale nie występuje długa, zupełnie sucha pora."]}, {"place": "Niamey, Niger", "answer": "podrównikowy suchy", "t": [24, 26, 30, 32, 33, 31, 29, 28, 29, 30, 28, 24], "p": [0, 0, 0, 0, 30, 60, 110, 145, 60, 12, 0, 0], "features": ["Temperatura przez cały rok przekracza 20°C.", "Występuje krótka pora deszczowa oraz długa pora sucha."]}, {"place": "Miami, USA", "answer": "zwrotnikowy wilgotny", "t": [20, 20, 22, 24, 27, 29, 30, 30, 30, 27, 24, 20], "p": [58, 55, 45, 65, 145, 195, 110, 140, 180, 140, 80, 45], "features": ["Najchłodniejszy miesiąc ma temperaturę około 20°C.", "Opady są wysokie, z wyraźniejszym maksimum w ciepłej części roku."]}, {"place": "Mount Isa, Australia", "answer": "zwrotnikowy pośredni", "t": [30, 30, 28, 24, 20, 18, 18, 20, 25, 30, 31, 30], "p": [105, 92, 60, 8, 18, 2, 10, 1, 10, 20, 30, 68], "features": ["Najcieplejsze miesiące przekraczają 30°C.", "Opady są umiarkowane i silnie nierównomierne w ciągu roku.", "W chłodniejszej części roku występuje bardzo mało opadów."]}, {"place": "Kair, Egipt", "answer": "zwrotnikowy suchy", "t": [14, 15, 17, 20, 24, 27, 28, 28, 26, 23, 19, 14], "p": [5, 5, 5, 3, 0, 0, 0, 0, 0, 0, 4, 5], "features": ["Opady są znikome lub prawie zerowe przez większość roku.", "Lato jest bardzo ciepłe, a najchłodniejszy miesiąc ma temperaturę dodatnią."]}, {"place": "Rzym, Włochy", "answer": "podzwrotnikowy morski", "t": [8, 9, 12, 15, 19, 23, 25, 25, 21, 17, 12, 9], "p": [78, 70, 70, 62, 45, 35, 18, 35, 78, 105, 118, 90], "features": ["Najchłodniejszy miesiąc ma temperaturę powyżej 0°C.", "Lato jest suche, a opady dominują w chłodniejszej części roku."]}, {"place": "Andora", "answer": "podzwrotnikowy pośredni", "t": [3, 3, 5, 9, 12, 15, 19, 19, 15, 11, 6, 3], "p": [55, 55, 75, 75, 100, 100, 65, 80, 80, 72, 72, 72], "features": ["Najcieplejszy miesiąc przekracza 20°C.", "Najchłodniejszy miesiąc może mieć temperaturę bliską 0°C lub niższą.", "Opady występują przez cały rok."]}, {"place": "Isfahan, Iran", "answer": "podzwrotnikowy suchy", "t": [5, 6, 10, 15, 20, 25, 28, 27, 25, 20, 13, 6], "p": [20, 20, 20, 20, 5, 1, 2, 0, 0, 3, 18, 20], "features": ["Opady są bardzo małe, szczególnie w lecie.", "Roczna amplituda temperatury jest wyraźna."]}, {"place": "Londyn, Wielka Brytania", "answer": "umiarkowany ciepły morski", "t": [4, 4, 6, 10, 14, 17, 19, 19, 15, 11, 7, 5], "p": [58, 40, 50, 50, 50, 50, 50, 55, 55, 60, 62, 58], "features": ["Opady występują przez cały rok.", "Roczna amplituda temperatury jest niewielka.", "Lata są umiarkowanie ciepłe, a zimy łagodne."]}, {"place": "Warszawa, Polska", "answer": "umiarkowany ciepły przejściowy", "t": [-5, -4, 1, 7, 13, 17, 19, 18, 13, 8, 3, -3], "p": [20, 25, 28, 35, 58, 72, 75, 58, 45, 35, 33, 30], "features": ["Występują cztery pory roku wyznaczone zmianami temperatury.", "Opady występują cały rok, z maksimum w lecie.", "Zimą średnie temperatury są ujemne, a lato jest ciepłe."]}, {"place": "Tebeler, Rosja", "answer": "umiarkowany ciepły suchy", "t": [-19, -18, -12, -4, 5, 12, 15, 13, 5, -4, -13, -18], "p": [5, 5, 1, 5, 10, 25, 35, 32, 15, 5, 5, 5], "features": ["Roczna amplituda temperatury jest duża.", "Zima jest długa i mroźna, a lato krótkie.", "Opady są niewielkie i najwyższe w lecie."]}, {"place": "Oslo, Norwegia", "answer": "umiarkowany chłodny morski", "t": [-5, -5, 0, 5, 10, 13, 15, 15, 10, 6, 0, -4], "p": [45, 45, 50, 50, 55, 70, 75, 88, 70, 65, 60, 55], "features": ["Najcieplejszy miesiąc jest chłodny lub umiarkowanie ciepły.", "Opady występują przez cały rok.", "Roczna amplituda temperatury jest nieduża."]}, {"place": "Joensuu, Finlandia", "answer": "umiarkowany chłodny przejściowy", "t": [-10, -9, -5, 1, 8, 14, 16, 14, 8, 2, -4, -8], "p": [40, 35, 35, 35, 35, 60, 82, 65, 65, 45, 45, 45], "features": ["Zimą średnie temperatury spadają do około -10°C.", "Opady występują cały rok i rosną w lecie.", "Roczna amplituda temperatury jest większa niż w klimacie morskim."]}, {"place": "Jakuck, Rosja", "answer": "umiarkowany chłodny suchy", "t": [-40, -35, -25, -10, 3, 14, 18, 15, 5, -10, -28, -38], "p": [5, 5, 5, 8, 20, 35, 40, 38, 30, 20, 8, 5], "features": ["Roczna amplituda temperatury jest bardzo duża.", "Zima jest bardzo mroźna i długa.", "Opady są niewielkie, z maksimum w lecie."]}, {"place": "Grenivik, Islandia", "answer": "subpolarny", "t": [-2, -2, -1, 2, 5, 8, 10, 10, 7, 4, 0, -2], "p": [62, 55, 58, 40, 25, 32, 42, 35, 35, 72, 45, 40], "features": ["Najcieplejszy miesiąc osiąga najwyżej około 10°C.", "Średnia roczna temperatura jest niska.", "Opady występują przez cały rok."]}, {"place": "Stacja Amundsen-Scott, Antarktyda", "answer": "polarny", "t": [-30, -40, -55, -55, -55, -58, -60, -60, -60, -50, -40, -30], "p": [8, 7, 6, 5, 4, 3, 3, 3, 4, 5, 6, 8], "features": ["Temperatury przez cały rok pozostają poniżej 0°C.", "Opady są bardzo niewielkie i mają charakter śnieżny."]}],types=["równikowy wybitnie wilgotny", "podrównikowy wilgotny", "podrównikowy suchy", "zwrotnikowy wilgotny", "zwrotnikowy pośredni", "zwrotnikowy suchy", "podzwrotnikowy morski", "podzwrotnikowy pośredni", "podzwrotnikowy suchy", "umiarkowany ciepły morski", "umiarkowany ciepły przejściowy", "umiarkowany ciepły suchy", "umiarkowany chłodny morski", "umiarkowany chłodny przejściowy", "umiarkowany chłodny suchy", "subpolarny", "polarny"],bank=["Temperatura przez cały rok przekracza 20°C.", "Roczna amplituda temperatury jest bardzo mała.", "Opady są wysokie w każdym miesiącu, bez pory suchej.", "Występuje krótka pora deszczowa oraz długa pora sucha.", "Najchłodniejszy miesiąc ma temperaturę powyżej 0°C.", "Lato jest suche, a opady dominują w chłodniejszej części roku.", "Opady występują przez cały rok.", "Roczna amplituda temperatury jest bardzo duża.", "Temperatury przez cały rok pozostają poniżej 0°C.", "Opady są znikome lub prawie zerowe przez większość roku.", "Zimą średnie temperatury są ujemne, a lato jest ciepłe.", "Najcieplejszy miesiąc osiąga najwyżej około 10°C."],selected={};const M=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];function E(x){return x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function chart(q){let w=780,h=340,p=54,lo=Math.floor((Math.min(...q.t)-5)/10)*10,hi=Math.ceil((Math.max(...q.t)+5)/10)*10,pm=Math.ceil(Math.max(...q.p)/50)*50,g='';for(let v=lo;v<=hi;v+=10){let y=p+(hi-v)*(h-2*p)/(hi-lo);g+=`<line x1="${p}" y1="${y}" x2="${w-p}" y2="${y}" stroke="#dce6ee"/><text x="${p-8}" y="${y+4}" text-anchor="end" font-size="12">${v}</text>`}for(let v=0;v<=pm;v+=50){let y=p+(pm-v)*(h-2*p)/pm;g+=`<text x="${w-p+8}" y="${y+4}" font-size="12">${v}</text>`}let bw=(w-2*p)/12-8,b=q.p.map((v,i)=>{let x=p+i*(w-2*p)/12+4,y=p+(pm-v)*(h-2*p)/pm;return `<rect x="${x}" y="${y}" width="${bw}" height="${h-p-y}" rx="2" fill="#2378c9"/>`}).join(''),line=q.t.map((v,i)=>`${p+i*(w-2*p)/11},${p+(hi-v)*(h-2*p)/(hi-lo)}`).join(' '),m=M.map((x,i)=>`<text x="${p+(i+.5)*(w-2*p)/12}" y="${h-25}" text-anchor="middle" font-size="12">${x}</text>`).join('');return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Klimatogram"><text x="${p}" y="24" font-size="15" font-weight="700">Klimatogram</text><text x="${p}" y="43" font-size="12" fill="#d83b47">temperatura °C</text><text x="${w-p}" y="43" text-anchor="end" font-size="12" fill="#2378c9">opady mm</text>${g}${b}<polyline points="${line}" fill="none" stroke="#d83b47" stroke-width="3"/>${m}</svg>`}function featureBox(q,i){let wrong=bank.filter(x=>!q.features.includes(x));let opad=wrong.filter(x=>/opad|pora deszczowa|Lato jest suche/i.test(x)).sort(()=>Math.random()-.5).slice(0,1);let temp=wrong.filter(x=>!/opad|pora deszczowa|Lato jest suche/i.test(x)).sort(()=>Math.random()-.5).slice(0,2);let a=[...new Set([...q.features,...opad,...temp])].sort(()=>Math.random()-.5);return `<div id="box${i}" class="features hidden"><strong>Zaznacz wszystkie cechy decydujące o rozpoznaniu:</strong><div class="feature-grid">${a.map(x=>`<label><input type="checkbox" value="${E(x)}"> ${E(x)}</label>`).join('')}</div><button class="check" data-c="${i}">Sprawdź cechy</button><div id="fb${i}" class="feedback"></div></div>`}function render(){document.getElementById('quiz').innerHTML=quiz.map((q,i)=>`<section class="card"><div class="top"><span class="badge">${i+1}/${quiz.length}</span><span>Wybierz typ klimatu</span></div>${chart(q)}<div class="answers">${types.map(x=>`<button data-i="${i}" data-a="${E(x)}">${E(x)}</button>`).join('')}</div><div id="msg${i}" class="feedback"></div>${featureBox(q,i)}</section>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(+b.dataset.i,b.dataset.a));document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>check(+b.dataset.c))}function answer(i,a){if(selected[i])return;selected[i]=a;let q=quiz[i],ok=a===q.answer;document.querySelectorAll(`[data-i="${i}"]`).forEach(b=>{b.disabled=true;if(b.dataset.a===q.answer)b.classList.add('correct');else if(b.dataset.a===a)b.classList.add('wrong')});document.getElementById('msg'+i).textContent=ok?'Odpowiedź poprawna. Uzasadnij wybór cechami wykresu.':'Odpowiedź niepoprawna; prawidłowy typ zaznaczono na zielono. Uzasadnij go cechami wykresu.';document.getElementById('box'+i).classList.remove('hidden');if(Object.keys(selected).length===quiz.length)document.getElementById('finish').disabled=false}function check(i){let q=quiz[i],box=document.getElementById('box'+i),checks=[...box.querySelectorAll('input')],picked=checks.filter(x=>x.checked).map(x=>x.value),ok=picked.length===q.features.length&&picked.every(x=>q.features.includes(x));checks.forEach(x=>{let l=x.parentElement;l.classList.remove('feature-ok','feature-bad');if(q.features.includes(x.value))l.classList.add('feature-ok');if(x.checked&&!q.features.includes(x.value))l.classList.add('feature-bad');x.disabled=true});box.querySelector('button').disabled=true;document.getElementById('fb'+i).textContent=ok?'Dobrze: wskazano komplet cech rozstrzygających.':'Sprawdź oznaczenia: zielone cechy są właściwe, a czerwone nie uzasadniają tego rozpoznania.'}document.getElementById('finish').onclick=()=>{let n=quiz.filter((q,i)=>selected[i]===q.answer).length,r=document.getElementById('result');r.className='result';r.innerHTML=`<strong>Wynik: ${n}/${quiz.length} poprawnych rozpoznań.</strong> Wróć do błędnych wykresów i porównaj najpierw temperatury skrajne, a potem rozkład opadów.`};render()</script></body></html>
