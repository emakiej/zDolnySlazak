const app=document.getElementById('app');let s={round:0,queue:[],pos:0,right:0,wrong:[],lastWrong:[],locked:false,order:[],timer:null};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let n=a.length-1;n>0;n--){const k=Math.floor(Math.random()*(n+1));[a[n],a[k]]=[a[k],a[n]];}return a;}
function picture(q){return q.kind==='image'?'<figure>'+I[q.object]+'</figure>':'';}
function start(ids,reset=false){clearTimeout(s.timer);if(reset){s.round=0;s.lastWrong=[];}s.round++;s.queue=shuffle(ids);s.pos=0;s.right=0;s.wrong=[];render();}
function current(){return Q.find(q=>q.id===s.queue[s.pos]);}
function render(){const q=current();s.locked=false;s.order=shuffle([0,1,2,3]);app.innerHTML='<div class="meta"><span>'+(s.round===1?'Full quiz':'Review • round '+s.round)+'</span><span>Question '+(s.pos+1)+' of '+s.queue.length+'</span></div><div class="progress" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="'+s.queue.length+'" aria-valuenow="'+s.pos+'"><div style="width:'+100*s.pos/s.queue.length+'%"></div></div><h2 id="question" tabindex="-1">'+esc(q.text)+'</h2>'+picture(q)+'<div class="answers">'+s.order.map((n,k)=>'<button type="button" class="answer" data-option="'+n+'"><span class="letter">'+'ABCD'[k]+'</span><span>'+esc(q.options[n])+'</span></button>').join('')+'</div><div class="feedback" id="feedback" role="status" aria-live="polite"></div>';app.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(Number(b.dataset.option)));document.getElementById('question').focus();}
function answer(n){if(s.locked)return;s.locked=true;const q=current(),good=n===q.correct;app.querySelectorAll('.answer').forEach(b=>{b.disabled=true;const v=Number(b.dataset.option);if(v===q.correct)b.classList.add('correct');if(v===n&&!good)b.classList.add('wrong');});const f=document.getElementById('feedback');f.className='feedback '+(good?'good':'bad');if(good){s.right++;f.textContent='Well done! That is correct.';s.timer=setTimeout(next,1000);}else{s.wrong.push(q.id);f.innerHTML='<p>Not quite. The correct answer is: <strong>'+esc(q.options[q.correct])+'</strong>.</p><button type="button" class="primary" id="ok">OK — continue</button>';document.getElementById('ok').addEventListener('click',next,{once:true});document.getElementById('ok').focus();}}
function next(){clearTimeout(s.timer);s.pos++;if(s.pos===s.queue.length)finish();else render();}
function finish(){s.lastWrong=s.wrong.slice();const n=s.lastWrong.length;app.innerHTML='<h2 id="result" tabindex="-1">Round score: '+s.right+' / '+s.queue.length+'</h2><p>Correct answers: '+Math.round(100*s.right/s.queue.length)+'%. '+(n?'Questions to practise: '+n+'.':'Excellent! There are no questions to practise.')+'</p><div class="actions"><button type="button" id="restart" class="primary">Start over</button><button type="button" id="repeat" class="secondary" '+(n?'':'disabled')+'>Retry — incorrect answers only</button><button type="button" id="review" class="secondary" '+(n?'':'disabled')+'>Show revision list</button><button type="button" id="print" class="secondary">Print all questions and answer key</button></div><div id="reviewlist"></div>';document.getElementById('restart').onclick=()=>start(Q.map(q=>q.id),true);document.getElementById('repeat').onclick=()=>{if(s.lastWrong.length)start(s.lastWrong);};document.getElementById('review').onclick=review;document.getElementById('print').onclick=()=>window.print();document.getElementById('result').focus();}
function review(){document.getElementById('reviewlist').innerHTML='<h2 id="reviewtitle" tabindex="-1">Revision list — last round only</h2>'+s.lastWrong.map(id=>{const q=Q.find(q=>q.id===id);return '<article class="review-item"><h3>'+esc(q.text)+'</h3>'+picture(q)+'<p class="review-answer">Correct answer: '+esc(q.options[q.correct])+'</p></article>';}).join('');document.getElementById('reviewtitle').focus();}
function printSheet(){document.getElementById('printsheet').innerHTML='<h1>20 famous landmarks — 40 questions</h1><p>Choose one answer per question. Countries covered: the UK, USA, Canada, Australia and New Zealand.</p>'+Q.map(q=>'<article class="print-q"><h2>'+q.id+'. '+esc(q.text)+'</h2>'+(q.kind==='image'?I[q.object]:'')+'<ol type="A">'+q.options.map(o=>'<li>'+esc(o)+'</li>').join('')+'</ol></article>').join('')+'<section class="key"><h1>Answer key</h1><p>These letters apply only to the fixed order on this printed sheet. Answers are shuffled in the interactive quiz.</p><table><thead><tr><th>Question</th><th>Letter</th><th>Correct answer</th></tr></thead><tbody>'+Q.map(q=>'<tr><td>'+q.id+'</td><td>'+'ABCD'[q.correct]+'</td><td>'+esc(q.options[q.correct])+'</td></tr>').join('')+'</tbody></table></section>';}
function home(){app.innerHTML='<p>40 questions: identify the location by name, and identify the landmark from its illustration.</p><div class="actions"><button type="button" id="begin" class="primary">Start quiz</button><button type="button" id="print" class="secondary">Print all questions and answer key</button></div>';document.getElementById('begin').onclick=()=>start(Q.map(q=>q.id),true);document.getElementById('print').onclick=()=>window.print();}
printSheet();home();</script></body></html>
