<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geografia — klimat i roślinność</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#EEEEE8;color:#293631;font:17px/1.55 system-ui,"Segoe UI",sans-serif}main{max-width:820px;margin:32px auto;padding:0 14px}.card{background:#FAFAF6;border:1px solid #CBD1C9;border-radius:14px;padding:28px}h1{font-size:29px;line-height:1.25;margin:0 0 12px}h2{font-size:23px;line-height:1.4;margin:24px 0 20px}.muted{color:#5A6861}button{font:inherit;border-radius:9px;padding:12px 16px;cursor:pointer;border:1px solid #CBD1C9}button:focus-visible{outline:3px solid #547E71;outline-offset:3px}button:disabled{cursor:default}.answers,.actions{display:grid;gap:12px}.answer{display:flex;gap:16px;width:100%;text-align:left;background:#FFFEFA;color:#293631}.letter{min-width:24px;font-weight:700}.answer:hover:not(:disabled){background:#E4EAE2;border-color:#879C8E}.primary{background:#365B50;color:#FFF}.primary:hover:not(:disabled){background:#29493F}.secondary{background:#FFFEFA;color:#293631}.actions button{width:100%}.actions button:disabled{opacity:.5}.correct{background:#E0ECE1!important;border-color:#6C9371!important}.wrong{background:#F1E4DF!important;border-color:#AD7E6F!important}.feedback{margin-top:20px;padding:16px;border-radius:9px}.feedback p{margin:0 0 12px}.feedback p:last-child{margin:0}.track{height:7px;border-radius:8px;background:#E1E5DF;margin-top:16px;overflow:hidden}.fill{height:100%;background:#789588;transition:width .2s}.review-answer{color:#315D43}.review li{margin-bottom:20px}.toolbar{margin:20px 0}.print-only{display:none}[hidden]{display:none!important}@media(max-width:560px){main{margin:16px auto}.card{padding:20px}h1{font-size:25px}h2{font-size:21px}}@media print{body{background:white;font-size:11pt}main{max-width:none;margin:0;padding:0}.card{border:none;padding:0}.screen-only{display:none!important}.print-only{display:block}.print-question{break-inside:avoid;margin-bottom:18px}.print-question p{margin:4px 0}.key{break-before:page}.key li{margin-bottom:8px}h1{font-size:20pt}}
</style></head><body><main><div class="card"><div class="screen-only"><h1>Geografia — klimat i roślinność</h1><p class="muted">Szkoła podstawowa · 30 pytań · jedna poprawna odpowiedź</p><div id="app"></div><div class="toolbar"><button class="secondary" id="print">Drukuj zestaw pytań z kluczem</button></div><p class="muted">Dobra odpowiedź: następne pytanie po sekundzie. Błędna odpowiedź: przeczytaj poprawną odpowiedź i naciśnij „OK”. Quiz działa bez internetu. Wyniki nie są zapisywane po zamknięciu lub odświeżeniu strony.</p></div><section class="print-only" id="printout"></section></div></main>
<script>
'use strict';
const questions=[{"id": 1, "q": "Co to jest pogoda?", "options": ["Typowy przebieg temperatury i opadów na danym obszarze ustalony na podstawie wieloletnich obserwacji.", "Stan atmosfery w określonym miejscu i czasie.", "Zmiana pór roku na Ziemi.", "Średnia temperatura całej Ziemi."], "correct": 1}, {"id": 2, "q": "Co to jest klimat?", "options": ["Temperatura powietrza w danym dniu.", "Prognoza pogody na najbliższy tydzień.", "Charakterystyczny dla danego obszaru przebieg warunków pogodowych, określony na podstawie wieloletnich obserwacji.", "Stan zachmurzenia w określonej godzinie."], "correct": 2}, {"id": 3, "q": "Które zdanie opisuje pogodę?", "options": ["Dziś w Krakowie pada deszcz, a temperatura wynosi 8°C.", "W klimacie śródziemnomorskim lata są gorące i suche.", "Na obszarach równikowych przez cały rok jest gorąco.", "W klimacie kontynentalnym występują duże różnice temperatury między latem a zimą."], "correct": 0}, {"id": 4, "q": "Który zestaw zawiera wyłącznie składniki pogody?", "options": ["Wysokość nad poziomem morza, gleba, wiatr.", "Roślinność, temperatura powietrza, opady.", "Szerokość geograficzna, zachmurzenie, gleba.", "Temperatura powietrza, ciśnienie atmosferyczne, wiatr."], "correct": 3}, {"id": 5, "q": "Czym charakteryzuje się klimat równikowy wybitnie wilgotny?", "options": ["Mroźną zimą i krótkim latem.", "Wysoką temperaturą i obfitymi opadami przez cały rok.", "Gorącym latem i opadami wyłącznie zimą.", "Niską temperaturą i bardzo małymi opadami przez cały rok."], "correct": 1}, {"id": 6, "q": "Co oznacza mała roczna amplituda temperatury powietrza?", "options": ["Niewielką różnicę między średnią temperaturą najcieplejszego i najchłodniejszego miesiąca.", "Niewielką liczbę dni deszczowych w roku.", "Bardzo niską temperaturę przez cały rok.", "Niewielką różnicę wysokości między dwoma miejscami."], "correct": 0}, {"id": 7, "q": "Co jest charakterystyczne dla klimatu podrównikowego w aspekcie opadów?", "options": ["Cztery termiczne pory roku, w tym mroźna zima.", "Brak opadów przez cały rok.", "Opady śniegu we wszystkich miesiącach.", "Występowanie pory deszczowej i pory suchej."], "correct": 3}, {"id": 8, "q": "Który opis klimatogramu wskazuje na klimat równikowy wybitnie wilgotny?", "options": ["Temperatura poniżej 0°C przez większość roku i niewielkie opady.", "Gorące lato, mroźna zima i małe opady.", "Wysoka temperatura we wszystkich miesiącach i obfite opady przez cały rok.", "Gorące, suche lato oraz łagodna, deszczowa zima."], "correct": 2}, {"id": 9, "q": "Jakie lato jest charakterystyczne dla klimatu śródziemnomorskiego?", "options": ["Gorące i suche.", "Chłodne i bardzo deszczowe.", "Mroźne i śnieżne.", "Krótkie, z częstymi przymrozkami."], "correct": 0}, {"id": 10, "q": "Jaka zima jest typowa dla klimatu śródziemnomorskiego?", "options": ["Długa, bardzo mroźna i sucha.", "Gorąca i pozbawiona opadów.", "Łagodna i deszczowa.", "Przez cały czas śnieżna."], "correct": 2}, {"id": 11, "q": "Który obszar jest typowym przykładem występowania klimatu śródziemnomorskiego?", "options": ["Wnętrze Grenlandii.", "Wybrzeże południowych Włoch.", "Północna Syberia.", "Dorzecze Amazonki."], "correct": 1}, {"id": 12, "q": "Które zdanie dotyczące klimatów podzwrotnikowych jest prawdziwe?", "options": ["W całej strefie opady występują wyłącznie latem.", "W całej strefie przez cały rok utrzymuje się mróz.", "W całej strefie występuje wyłącznie klimat śródziemnomorski.", "W strefie tej występują różne typy klimatu, między innymi śródziemnomorski i wilgotny."], "correct": 3}, {"id": 13, "q": "Jak morze zazwyczaj wpływa na klimat pobliskiego lądu?", "options": ["Powoduje występowanie mrozu przez cały rok.", "Całkowicie zatrzymuje opady.", "Łagodzi zimy i ogranicza letnie upały.", "Zawsze zwiększa różnicę temperatury między latem a zimą."], "correct": 2}, {"id": 14, "q": "Czym zazwyczaj wyróżnia się klimat umiarkowany kontynentalny w porównaniu z morskim na podobnej szerokości geograficznej?", "options": ["Większą roczną amplitudą temperatury.", "Mniejszą różnicą temperatury między latem a zimą.", "Brakiem zimy.", "Jednakową temperaturą we wszystkich miesiącach."], "correct": 0}, {"id": 15, "q": "Jak określa się klimat Polski?", "options": ["Równikowy wybitnie wilgotny.", "Podzwrotnikowy śródziemnomorski.", "Okołobiegunowy.", "Umiarkowany ciepły przejściowy."], "correct": 3}, {"id": 16, "q": "Co oznacza przejściowość klimatu Polski?", "options": ["Polska co kilka lat zmienia strefę klimatyczną.", "W Polsce zaznaczają się zarówno wpływy klimatu morskiego, jak i kontynentalnego.", "W Polsce nie występują pory roku.", "Klimat Polski zależy wyłącznie od Morza Bałtyckiego."], "correct": 1}, {"id": 17, "q": "Co jest typowe dla klimatu umiarkowanego chłodnego na obszarach tajgi?", "options": ["Długa, mroźna zima i krótkie lato.", "Gorąca pora sucha i gorąca pora deszczowa.", "Gorące, suche lato i łagodna, deszczowa zima.", "Wysoka temperatura i obfite deszcze przez cały rok."], "correct": 0}, {"id": 18, "q": "Jakie warunki najbardziej sprzyjają rozwojowi wilgotnego lasu równikowego?", "options": ["Długa, mroźna zima i niewielkie opady.", "Wysoka temperatura i obfite opady przez cały rok.", "Gorące lato i całkowity brak opadów.", "Krótkie, chłodne lato i wieloletnia zmarzlina."], "correct": 1}, {"id": 19, "q": "Która formacja roślinna składa się głównie z traw, wśród których rosną pojedyncze drzewa, na przykład akacje i baobaby?", "options": ["Tajga.", "Tundra.", "Sawanna.", "Wilgotny las równikowy."], "correct": 2}, {"id": 20, "q": "Jakie drzewa dominują w tajdze?", "options": ["Oliwne.", "Palmy.", "Kakaowce.", "Iglaste, na przykład świerki, sosny i modrzewie."], "correct": 3}, {"id": 21, "q": "Który zestaw roślin jest charakterystyczny dla tundry?", "options": ["Mchy, porosty i karłowate krzewy.", "Palmy, liany i paprocie drzewiaste.", "Baobaby, akacje i wysokie trawy.", "Oliwki, cyprysy i dęby korkowe."], "correct": 0}, {"id": 22, "q": "Dlaczego w tundrze nie występują lasy wysokich drzew?", "options": ["Ponieważ przez cały rok jest tam gorąco.", "Ponieważ pada tam zbyt dużo deszczu przy wysokiej temperaturze.", "Ponieważ lato jest zbyt krótkie i chłodne, a rozwój korzeni ogranicza wieloletnia zmarzlina.", "Ponieważ tundra występuje wyłącznie na piaskach pustynnych."], "correct": 2}, {"id": 23, "q": "Jaką funkcję pełnią małe, twarde i skórzaste liście wielu roślin śródziemnomorskich?", "options": ["Umożliwiają pobieranie soli z wody morskiej.", "Ograniczają utratę wody podczas suchego lata.", "Pozwalają roślinom rosnąć bez światła.", "Chronią rośliny wyłącznie przed obfitym śniegiem."], "correct": 1}, {"id": 24, "q": "Które przystosowanie pomaga roślinom pustynnym przetrwać niedobór wody?", "options": ["Wytwarzanie zawsze dużych, cienkich liści.", "Brak korzeni.", "Konieczność codziennych, obfitych opadów.", "Magazynowanie wody w mięsistych łodygach lub liściach."], "correct": 3}, {"id": 25, "q": "Co łączy step i sawannę?", "options": ["Dominacja traw w krajobrazie.", "Występowanie zwartego lasu iglastego.", "Położenie wyłącznie w strefie okołobiegunowej.", "Obecność obfitych opadów przez cały rok."], "correct": 0}, {"id": 26, "q": "W jakim klimacie występują typowe stepy Eurazji?", "options": ["Równikowym wybitnie wilgotnym.", "Umiarkowanym ciepłym kontynentalnym, ze zbyt małymi opadami dla rozwoju zwartego lasu.", "Okołobiegunowym, z bardzo krótkim i chłodnym latem.", "Podzwrotnikowym wilgotnym, z obfitymi opadami przez cały rok."], "correct": 1}, {"id": 27, "q": "Które stwierdzenie prawidłowo porównuje temperaturę na stepie i sawannie?", "options": ["Na stepie przez cały rok jest gorąco, a na sawannie występuje długa, mroźna zima.", "Zarówno na stepie, jak i na sawannie przez cały rok utrzymuje się mróz.", "Na stepie i sawannie temperatura jest zawsze jednakowa.", "Na stepie mogą występować gorące lata i mroźne zimy, a na sawannie przez cały rok jest ciepło lub gorąco."], "correct": 3}, {"id": 28, "q": "Który opis najlepiej pasuje do sawanny?", "options": ["Gęsty las iglasty, długa zima i krótki okres wegetacyjny.", "Mchy i porosty rosnące na obszarze wieloletniej zmarzliny.", "Rozległe trawy, pojedyncze drzewa oraz pora sucha i deszczowa.", "Gęsty, wielopiętrowy las i codzienne deszcze przez cały rok."], "correct": 2}, {"id": 29, "q": "Które przyporządkowanie jest prawidłowe?", "options": ["Step — Kazachstan; sawanna — Afryka Wschodnia.", "Step — wnętrze Grenlandii; sawanna — Antarktyda.", "Step — dorzecze Amazonki; sawanna — północna Syberia.", "Step — wybrzeże Antarktydy; sawanna — północna Grenlandia."], "correct": 0}, {"id": 30, "q": "Dlaczego na typowym stepie nie rozwija się zwarty las?", "options": ["Ponieważ gleba przez cały rok pozostaje zamarznięta.", "Ponieważ temperatura przez cały rok przekracza 30°C.", "Ponieważ codzienne deszcze uniemożliwiają wzrost drzew.", "Ponieważ opady są zbyt małe, a okresowe niedobory wody utrudniają rozwój zwartego lasu."], "correct": 3}];
const app=document.getElementById('app');
let round=[],position=0,score=0,mistakes=[],lastMistakes=[],roundNumber=0,locked=false,timer=null;
const letters=['A','B','C','D'];
function shuffle(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function button(text,fn,cls='primary'){const b=node('button',text,cls);b.type='button';b.addEventListener('click',fn);return b;}
function start(items,reset=false){clearTimeout(timer);if(reset){lastMistakes=[];roundNumber=0;}roundNumber++;round=shuffle(items);position=0;score=0;mistakes=[];showQuestion();}
function showQuestion(){locked=false;app.replaceChildren();const q=round[position];app.append(node('p',(roundNumber===1?'Pełny quiz':'Powtórka '+(roundNumber-1))+' · Pytanie '+(position+1)+' z '+round.length,'muted'));const track=node('div',undefined,'track');track.setAttribute('role','progressbar');track.setAttribute('aria-label','Ukończone pytania');track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax',round.length);track.setAttribute('aria-valuenow',position);const fill=node('div',undefined,'fill');fill.style.width=(position/round.length*100)+'%';track.append(fill);app.append(track);const title=node('h2',q.q);title.tabIndex=-1;app.append(title);const box=node('div',undefined,'answers');const variants=shuffle(q.options.map((text,id)=>({text,id})));const feedback=node('div');feedback.setAttribute('aria-live','polite');feedback.setAttribute('aria-atomic','true');variants.forEach((v,i)=>{const b=button('',()=>answer(v.id,i,b,q,variants,box,feedback),'answer');b.append(node('span',letters[i]+'.','letter'),node('span',v.text));box.append(b);});app.append(box,feedback);title.focus();}
function answer(id,displayIndex,selected,q,variants,box,feedback){if(locked)return;locked=true;const buttons=Array.from(box.children);buttons.forEach(b=>b.disabled=true);const goodIndex=variants.findIndex(v=>v.id===q.correct);buttons[goodIndex].classList.add('correct');feedback.className='feedback '+(id===q.correct?'correct':'wrong');if(id===q.correct){score++;feedback.append(node('p','Dobrze! Poprawna odpowiedź.'));timer=setTimeout(next,1000);}else{mistakes.push(q);selected.classList.add('wrong');feedback.append(node('p','To nie jest poprawna odpowiedź.'),node('p','Poprawna odpowiedź: '+letters[goodIndex]+'. '+q.options[q.correct]));const ok=button('OK',next);feedback.append(ok);ok.focus();}}
function next(){clearTimeout(timer);position++;if(position<round.length)showQuestion();else finish();}
function finish(){lastMistakes=mistakes.slice();app.replaceChildren();const heading=node('h2','Wynik rundy: '+score+' / '+round.length);heading.tabIndex=-1;app.append(heading,node('p','Poprawne odpowiedzi: '+Math.round(score/round.length*100)+'%. Liczba pytań do poprawy: '+lastMistakes.length+'.'));const actions=node('div',undefined,'actions');const retry=button('Powtórz quiz — pytania do poprawy',()=>start(lastMistakes));const review=button('Wyświetl listę wiedzy do powtórzenia',()=>showReview());retry.disabled=review.disabled=lastMistakes.length===0;actions.append(button('Zacznij od nowa',()=>start(questions,true)),retry,review);app.append(actions);if(!lastMistakes.length)app.append(node('p','Brawo! Nie ma pytań do poprawy.'));const reviewArea=node('section');reviewArea.id='review';reviewArea.hidden=true;app.append(reviewArea);heading.focus();}
function showReview(){const area=document.getElementById('review');area.replaceChildren();area.hidden=false;const h=node('h2','Wiedza do powtórzenia — ostatnia runda');h.tabIndex=-1;area.append(h);const list=node('ol',undefined,'review');lastMistakes.forEach(q=>{const li=node('li');li.append(node('p',q.q),node('p','Poprawna odpowiedź: '+q.options[q.correct],'review-answer'));list.append(li);});area.append(list);h.focus();}
function preparePrint(){const out=document.getElementById('printout');out.append(node('h1','Geografia — klimat i roślinność'),node('p','Imię i nazwisko: ........................................   Data: ....................'),node('p','W każdym pytaniu zaznacz jedną poprawną odpowiedź.'));questions.forEach(q=>{const item=node('div',undefined,'print-question');item.append(node('h3',q.id+'. '+q.q));q.options.forEach((o,i)=>item.append(node('p',letters[i]+'. '+o)));out.append(item);});const key=node('section',undefined,'key');key.append(node('h1','Klucz odpowiedzi'));const list=node('ol');questions.forEach(q=>list.append(node('li',letters[q.correct]+'. '+q.options[q.correct])));key.append(list);out.append(key);}
document.getElementById('print').addEventListener('click',()=>window.print());preparePrint();start(questions,true);
</script><noscript>Do działania quizu włącz JavaScript w przeglądarce.</noscript></body></html>
