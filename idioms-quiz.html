<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Idioms and Proverbs Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#EEEEE8;color:#293631;font:17px/1.55 system-ui,'Segoe UI',sans-serif}main{max-width:820px;margin:32px auto;padding:0 16px}.card{padding:28px;background:#FAFAF6;border:1px solid #CBD1C9;border-radius:14px}h1{font-size:29px;margin:0 0 8px}h2{font-size:23px;line-height:1.4;margin:24px 0;font-weight:600}p{margin:12px 0}.muted{color:#5A6861}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:15px;margin:20px 0 8px}.track{height:7px;background:#E1E5DF;border-radius:9px;overflow:hidden}.fill{height:100%;background:#789588;transition:width .2s}button{font:inherit;cursor:pointer;border:1px solid #CBD1C9;border-radius:9px;padding:12px 16px;min-height:50px}button:focus-visible{outline:3px solid #547E71;outline-offset:3px}.answers,.actions{display:grid;gap:12px}.answer{text-align:left;width:100%;background:#FFFEFA;color:#293631;display:flex;align-items:baseline;gap:16px}.letter{font-weight:700;flex:0 0 24px;border-right:1px solid #CBD1C9;padding-right:10px}.answer:hover:not(:disabled){background:#E4EAE2;border-color:#879C8E}.answer:disabled{cursor:default;opacity:1}.answer.correct{background:#E0ECE1;border-color:#6C9371}.answer.wrong{background:#F1E4DF;border-color:#AD7E6F}.primary{background:#365B50;color:white;border-color:#365B50;text-align:center;width:100%}.primary:hover:not(:disabled){background:#29493F}.primary:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:20px;padding:16px;border-radius:9px}.feedback.good{background:#E0ECE1;border:1px solid #6C9371}.feedback.bad{background:#F1E4DF;border:1px solid #AD7E6F}.feedback button{margin-top:12px}.score{font-size:26px;margin:20px 0}.review{padding-left:25px}.review li{margin:20px 0}.solution{color:#315D43;margin-top:6px}.actions{margin-top:24px}[hidden]{display:none!important}@media(max-width:540px){main{margin:16px auto;padding:0 10px}.card{padding:20px}h1{font-size:25px}h2{font-size:21px}.answer{padding:12px;gap:10px}}
</style></head><body><main><section class="card"><h1>Idioms and Proverbs Quiz</h1><p class="muted">60 questions · Choose the best meaning. Questions and answers are shuffled in every round.</p><div id="app"></div></section><noscript>Please enable JavaScript to use this offline quiz.</noscript></main>
<script>
'use strict';
const questions=[{"id": 0, "q": "During a discussion about a potential business partner, someone says, “That’s a red flag.” What do they mean?", "options": ["It is a disagreement that requires compromise.", "It is a warning sign of a possible problem.", "It is a condition that must be formally approved.", "It is a mistake that has already caused damage."], "correct": 1}, {"id": 1, "q": "What does “beat around the bush” mean?", "options": ["Avoid discussing the main issue directly.", "Explain an issue through several examples.", "Investigate every possible explanation.", "Challenge someone without being openly rude."], "correct": 0}, {"id": 2, "q": "If a repair “costs an arm and a leg”, what does that mean?", "options": ["It involves a serious personal sacrifice.", "It requires more work than expected.", "It is extremely expensive.", "It creates a debt that cannot be repaid."], "correct": 2}, {"id": 3, "q": "Someone says, “The ball is in your court.” What do they mean?", "options": ["You have gained an advantage over your opponent.", "You are responsible for an earlier mistake.", "You have permission to change the rules.", "It is now your responsibility to act or decide."], "correct": 3}, {"id": 4, "q": "What is “an elephant in the room”?", "options": ["A powerful person whose opinion dominates a discussion.", "An obvious, important issue that people avoid discussing.", "An unexpected event that disrupts a carefully prepared plan.", "A complicated issue that nobody fully understands."], "correct": 1}, {"id": 5, "q": "What does “spill the beans” mean?", "options": ["Reveal information that was supposed to remain secret.", "Explain why a plan failed.", "Admit responsibility for a costly mistake.", "Make a promise that cannot be kept."], "correct": 0}, {"id": 6, "q": "What warning does “curiosity killed the cat” express?", "options": ["Acting without preparation usually leads to failure.", "Distrusting others can damage valuable relationships.", "Asking too many questions or investigating too much can cause trouble.", "Focusing on small details can hide the main problem."], "correct": 2}, {"id": 7, "q": "Someone says, “A penny for your thoughts.” What are they doing?", "options": ["Asking you to make a quick decision.", "Suggesting that your advice has little value.", "Offering a small reward for useful information.", "Asking what you are thinking about."], "correct": 3}, {"id": 8, "q": "What does “all that glitters is not gold” mean?", "options": ["Expensive possessions rarely bring lasting happiness.", "Something attractive may not be as valuable or good as it appears.", "Genuine quality is usually difficult to notice.", "Success often requires accepting unpleasant conditions."], "correct": 1}, {"id": 9, "q": "Someone calls an invention “the best thing since sliced bread”. What do they mean?", "options": ["It is exceptionally good or useful.", "It makes an ordinary activity unnecessarily complicated.", "It is successful mainly because it is familiar.", "It improves something that was already nearly perfect."], "correct": 0}, {"id": 10, "q": "In informal conversation, what does “spill the tea” mean?", "options": ["State an unpopular opinion without hesitation.", "Confess something embarrassing about yourself.", "Share gossip or revealing personal details.", "Challenge a misleading version of events."], "correct": 2}, {"id": 11, "q": "What is “a glow-up”?", "options": ["A brief period of unusually high confidence.", "Public recognition after years of effort.", "A deliberate attempt to appear wealthier.", "A noticeable positive transformation in appearance or presentation."], "correct": 3}, {"id": 12, "q": "What attitude does “YOLO” commonly express?", "options": ["Avoid commitments because circumstances can change.", "Take an opportunity or enjoy an experience because life is limited.", "Focus on one ambition rather than several.", "Accept that mistakes cannot be reversed."], "correct": 1}, {"id": 13, "q": "In slang, what does “understand the assignment” mean?", "options": ["Recognise exactly what is expected and deliver it successfully.", "Follow instructions even when they seem unreasonable.", "Finish a task without needing any assistance.", "Discover the hidden purpose behind someone’s request."], "correct": 0}, {"id": 14, "q": "In slang, someone “ate and left no crumbs”. What does that mean?", "options": ["They took all the credit for a shared achievement.", "They defeated a rival through aggressive tactics.", "They performed exceptionally well and impressed everyone.", "They completed something without leaving evidence."], "correct": 2}, {"id": 15, "q": "In a social setting, what does “chin-chin” mean?", "options": ["An invitation to begin eating.", "A request to speak more quietly.", "A friendly way to end a conversation.", "A toast said when raising a drink."], "correct": 3}, {"id": 16, "q": "In “She picked up some Italian while living in Rome”, what does “picked up” mean?", "options": ["Studied it through a formal qualification.", "Learned it informally through exposure or practice.", "Remembered something she had previously forgotten.", "Understood it immediately without any exposure."], "correct": 1}, {"id": 17, "q": "What does “get to the point” mean?", "options": ["State the main message without unnecessary detail.", "Reach an agreement after a disagreement.", "Provide enough evidence to support an argument.", "Recognise the practical consequences of a decision."], "correct": 0}, {"id": 18, "q": "What does “mind your business” mean?", "options": ["Pay closer attention to your professional responsibilities.", "Consider how your actions affect other people.", "Stop interfering in matters that do not concern you.", "Keep information about your employer confidential."], "correct": 2}, {"id": 19, "q": "What does “last but not least” indicate?", "options": ["The final item is the most important of all.", "The final item nearly failed to qualify for inclusion.", "The final item is a summary of the others.", "The final item is important despite being mentioned last."], "correct": 3}, {"id": 20, "q": "What does “without further ado” mean?", "options": ["Without consulting anyone else.", "Without additional delay or unnecessary introduction.", "Without changing the original arrangement.", "Without revealing what will happen next."], "correct": 1}, {"id": 21, "q": "If a musician has been “off the radar”, what does that suggest?", "options": ["They have not been receiving much public attention.", "They have been deliberately misleading their audience.", "They have stopped caring about professional standards.", "They have been excluded from their industry."], "correct": 0}, {"id": 22, "q": "What does “have something up your sleeve” mean?", "options": ["Have an obligation that others do not know about.", "Possess information obtained unfairly.", "Have a secret plan, idea or resource available.", "Have an advantage that cannot be used yet."], "correct": 2}, {"id": 23, "q": "What does “She has a lot of time on her hands” mean?", "options": ["She is responsible for organising other people’s schedules.", "She has been waiting longer than expected.", "She has enough experience to work efficiently.", "She has plenty of free time available."], "correct": 3}, {"id": 24, "q": "What does “once in a blue moon” mean?", "options": ["At an unpredictable moment.", "Very rarely.", "Once under special conditions.", "After a particularly long delay."], "correct": 1}, {"id": 25, "q": "What does “put a sock in it” mean?", "options": ["Stop talking or making noise.", "Stop complaining and take action.", "Keep a particular piece of information secret.", "Express criticism more politely."], "correct": 0}, {"id": 26, "q": "What does “as safe as houses” mean?", "options": ["Familiar enough to feel comfortable.", "Protected by strict official regulations.", "Very secure or unlikely to be harmed.", "Valuable enough to justify the risk."], "correct": 2}, {"id": 27, "q": "What does “take something with a pinch of salt” mean?", "options": ["Accept it while recognising that it may be unpleasant.", "Treat it as a joke rather than an insult.", "Consider it briefly before rejecting it.", "Regard it with some doubt rather than fully believing it."], "correct": 3}, {"id": 28, "q": "What does “be over the moon” mean?", "options": ["Be so surprised that you cannot respond.", "Be extremely happy.", "Be unrealistically confident about the future.", "Be temporarily distracted by strong emotions."], "correct": 1}, {"id": 29, "q": "What does “put up with something” mean?", "options": ["Tolerate something unpleasant.", "Postpone dealing with a problem.", "Defend something others dislike.", "Become accustomed to something enjoyable."], "correct": 0}, {"id": 30, "q": "What does “come in handy” mean?", "options": ["Become easier to use with practice.", "Arrive sooner than expected.", "Prove useful in a particular situation.", "Be available without requiring payment."], "correct": 2}, {"id": 31, "q": "What does “be down in the mouth” mean?", "options": ["Be unwilling to express an opinion.", "Be ashamed of something you said.", "Be physically exhausted after speaking.", "Be unhappy or discouraged."], "correct": 3}, {"id": 32, "q": "What does “out of sight, out of mind” suggest?", "options": ["Private problems are usually less serious than public ones.", "People tend to forget things or people they no longer encounter.", "Avoiding difficult situations makes them easier to understand.", "Physical distance prevents people from knowing the truth."], "correct": 1}, {"id": 33, "q": "What does “don’t judge a book by its cover” advise?", "options": ["Do not assess someone or something solely by outward appearance.", "Do not decide before hearing every possible opinion.", "Do not assume that expensive things offer better quality.", "Do not criticise something you could not produce yourself."], "correct": 0}, {"id": 34, "q": "What does “beauty is in the eye of the beholder” mean?", "options": ["People appreciate beauty more when they understand its origins.", "Familiarity makes people and places seem more attractive.", "Judgements of beauty depend on individual perception.", "Attractive appearances can prevent objective judgement."], "correct": 2}, {"id": 35, "q": "What does “actions speak louder than words” mean?", "options": ["Acting quickly matters more than choosing carefully.", "Demonstrations explain technical ideas better than speech.", "Quiet people often achieve more than talkative people.", "Behaviour provides stronger evidence than promises or statements."], "correct": 3}, {"id": 36, "q": "What does “break the ice” mean?", "options": ["Introduce a controversial subject to test people’s reactions.", "Make people feel more relaxed at the start of an interaction.", "End a period of disagreement by making a concession.", "Interrupt a formal event with an unexpected announcement."], "correct": 1}, {"id": 37, "q": "If a task is “a piece of cake”, what does that mean?", "options": ["It is very easy.", "It is enjoyable but not useful.", "It is a small part of a larger responsibility.", "It offers a reward for little effort."], "correct": 0}, {"id": 38, "q": "What does “let the cat out of the bag” mean?", "options": ["Allow a manageable problem to become serious.", "Release someone from an obligation.", "Reveal a secret, often accidentally.", "Expose someone’s dishonest intentions."], "correct": 2}, {"id": 39, "q": "What does “under the weather” mean?", "options": ["Discouraged by circumstances beyond your control.", "Unable to concentrate because of tiredness.", "Uncomfortable in an unfamiliar situation.", "Feeling slightly ill."], "correct": 3}, {"id": 40, "q": "What does “hit the nail on the head” mean?", "options": ["Resolve a problem through decisive action.", "Identify or describe something exactly correctly.", "Make a criticism that feels unnecessarily personal.", "Reach the final stage of a difficult task."], "correct": 1}, {"id": 41, "q": "What does “break a leg!” mean when said to a performer?", "options": ["Good luck!", "Give it more energy!", "Do not become overconfident!", "Be prepared for criticism!"], "correct": 0}, {"id": 42, "q": "What does “call it a day” mean?", "options": ["Decide that a project has permanently failed.", "Agree on when a task must be completed.", "Stop working on an activity for the time being.", "Reduce a task to the amount achievable in one day."], "correct": 2}, {"id": 43, "q": "What does “hit the books” mean?", "options": ["Search for evidence in published sources.", "Review the financial records of an organisation.", "Return borrowed materials before a deadline.", "Begin studying seriously."], "correct": 3}, {"id": 44, "q": "What does “bite off more than you can chew” mean?", "options": ["Attempt something before you have enough information.", "Accept more responsibility or work than you can manage.", "Use resources faster than you can replace them.", "Demand more from others than you contribute yourself."], "correct": 1}, {"id": 45, "q": "What does “burn the midnight oil” mean?", "options": ["Work or study late into the night.", "Continue working despite diminishing results.", "Use your remaining resources on a final attempt.", "Delay starting until a deadline becomes urgent."], "correct": 0}, {"id": 46, "q": "What does “bite the bullet” mean?", "options": ["Accept responsibility for someone else’s mistake.", "Resist pressure to change your position.", "Make yourself do something necessary but unpleasant.", "Take a major risk in pursuit of a reward."], "correct": 2}, {"id": 47, "q": "What does “cut corners” mean?", "options": ["Remove unnecessary steps while maintaining standards.", "Reduce spending by choosing simpler goals.", "Change direction to avoid an emerging problem.", "Save time or money by neglecting proper standards."], "correct": 3}, {"id": 48, "q": "What does “keep your chin up!” encourage someone to do?", "options": ["Defend their reputation against criticism.", "Remain positive despite difficulties.", "Hide their emotions in public.", "Refuse to accept an unfair decision."], "correct": 1}, {"id": 49, "q": "What does “go the extra mile” mean?", "options": ["Make more effort than is normally expected.", "Continue pursuing a goal after it becomes unrealistic.", "Choose a less direct but more reliable method.", "Complete someone else’s responsibilities without permission."], "correct": 0}, {"id": 50, "q": "What is “a blessing in disguise”?", "options": ["A benefit that must be kept secret to remain useful.", "A fortunate event that creates unexpected obligations.", "Something initially unwelcome that later proves beneficial.", "An advantage that other people fail to appreciate."], "correct": 2}, {"id": 51, "q": "What does “throw in the towel” mean?", "options": ["Abandon one method in order to try another.", "Admit a mistake while continuing the task.", "Stop temporarily to recover your energy.", "Give up and accept defeat."], "correct": 3}, {"id": 52, "q": "What does “better late than never” mean?", "options": ["Important tasks deserve more time than people usually allow.", "Doing something after the ideal time is preferable to not doing it at all.", "A delayed decision is often more accurate than an immediate one.", "Missing a deadline is acceptable if the result is excellent."], "correct": 1}, {"id": 53, "q": "What does “the grass is always greener on the other side” suggest?", "options": ["Other people’s circumstances often seem better than our own.", "Changing your environment usually improves your opportunities.", "Success depends on finding conditions suited to your abilities.", "People appreciate what they have only after losing it."], "correct": 0}, {"id": 54, "q": "What does “strike while the iron is hot” advise?", "options": ["Maintain pressure until resistance disappears.", "Finish difficult work before attempting easier tasks.", "Act while conditions are favourable.", "Prepare carefully before making an irreversible decision."], "correct": 2}, {"id": 55, "q": "What does “many hands make light work” mean?", "options": ["Dividing responsibility reduces the consequences of mistakes.", "Large groups produce more original solutions.", "Repeated practice makes demanding work feel easier.", "A task becomes easier when more people help."], "correct": 3}, {"id": 56, "q": "What does “honesty is the best policy” recommend?", "options": ["Share everything you know, regardless of the consequences.", "Tell the truth rather than rely on deception.", "Admit only mistakes that others are likely to discover.", "Express your opinions even when nobody asks for them."], "correct": 1}, {"id": 57, "q": "What does “a picture is worth a thousand words” mean?", "options": ["An image can communicate an idea more effectively than a lengthy explanation.", "Visual evidence is always more trustworthy than spoken testimony.", "A memorable appearance matters more than the information presented.", "Complex subjects should be simplified before they are discussed."], "correct": 0}, {"id": 58, "q": "What does “no pain, no gain” suggest?", "options": ["Suffering automatically produces personal growth.", "Success is more satisfying when it follows failure.", "Meaningful improvement usually requires effort or discomfort.", "Taking greater risks always leads to greater rewards."], "correct": 2}, {"id": 59, "q": "What does “a bird in the hand is worth two in the bush” mean?", "options": ["A modest achievement is more impressive than an ambitious plan.", "Dividing your resources reduces the risk of losing everything.", "Patience usually produces a greater reward than immediate action.", "A certain benefit is preferable to a larger but uncertain possibility."], "correct": 3}];
const app=document.getElementById('app');
let round=[],position=0,score=0,mistakes=[],lastMistakes=[],roundNumber=0,locked=false,timer=null;
function shuffle(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function element(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}
function button(text,fn){const b=element('button',text,'primary');b.type='button';b.addEventListener('click',fn);return b}
function focus(el){el.tabIndex=-1;el.focus()}
function start(ids,reset=false){clearTimeout(timer);if(reset){roundNumber=0;lastMistakes=[]}roundNumber++;round=shuffle(ids);position=0;score=0;mistakes=[];showQuestion()}
function showQuestion(){locked=false;app.replaceChildren();const q=questions[round[position]];const meta=element('div',undefined,'meta');meta.append(element('span',`Round ${roundNumber} · Question ${position+1} of ${round.length}`),element('span',`Correct: ${score}`));app.append(meta);const track=element('div',undefined,'track');track.setAttribute('role','progressbar');track.setAttribute('aria-label','Round progress');track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax',String(round.length));track.setAttribute('aria-valuenow',String(position));const fill=element('div',undefined,'fill');fill.style.width=`${position/round.length*100}%`;track.append(fill);app.append(track);const title=element('h2',q.q);app.append(title);const answers=element('div',undefined,'answers');answers.setAttribute('role','group');answers.setAttribute('aria-label','Answer options');const order=shuffle(q.options.map((_,i)=>i));const feedback=element('div');feedback.setAttribute('aria-live','polite');feedback.setAttribute('aria-atomic','true');const buttons=[];order.forEach((optionIndex,i)=>{const b=element('button',undefined,'answer');b.type='button';b.append(element('span',String.fromCharCode(65+i),'letter'),element('span',q.options[optionIndex]));b.addEventListener('click',()=>{if(locked)return;locked=true;buttons.forEach(x=>x.disabled=true);const correctButton=buttons[order.indexOf(q.correct)];correctButton.classList.add('correct');if(optionIndex===q.correct){score++;feedback.className='feedback good';feedback.append(element('p','Correct! Well done.'));timer=setTimeout(next,1000)}else{mistakes.push(q.id);b.classList.add('wrong');feedback.className='feedback bad';feedback.append(element('p','Incorrect.'),element('p',`Correct answer: ${q.options[q.correct]}`));const ok=button('OK — continue',next);feedback.append(ok);ok.focus()}});buttons.push(b);answers.append(b)});app.append(answers,feedback);focus(title)}
function next(){clearTimeout(timer);position++;if(position<round.length)showQuestion();else finish()}
function finish(){lastMistakes=mistakes.slice();app.replaceChildren();const heading=element('h2',`Round ${roundNumber} complete`);app.append(heading,element('p',`${score} / ${round.length} correct (${Math.round(score/round.length*100)}%)`,'score'),element('p','This score applies only to the round you have just completed.','muted'));app.append(element('p',lastMistakes.length?`${lastMistakes.length} question${lastMistakes.length===1?'':'s'} to review. The next practice round includes only these questions.`:'Excellent! There are no questions to improve.'));const actions=element('div',undefined,'actions');const restart=button('Start over — full quiz',()=>start(questions.map(q=>q.id),true));const repeat=button('Repeat quiz — questions to improve',()=>start(lastMistakes));const review=button('Show review list',showReview);repeat.disabled=review.disabled=lastMistakes.length===0;actions.append(restart,repeat,review);app.append(actions);focus(heading)}
function showReview(){app.replaceChildren();const heading=element('h2','Knowledge to review');app.append(heading,element('p','Only incorrect answers from your most recently completed round are included.','muted'));const list=element('ol',undefined,'review');lastMistakes.forEach(id=>{const q=questions[id];const li=element('li');li.append(element('div',q.q),element('div',`Correct answer: ${q.options[q.correct]}`,'solution'));list.append(li)});app.append(list);const actions=element('div',undefined,'actions');actions.append(button('Back to round results',finish));app.append(actions);focus(heading)}
start(questions.map(q=>q.id),true);
</script></body></html>
