<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USA Quiz</title>
<style>
:root {
  --bg: #EEEEE8;
  --card: #FAFAF6;
  --text: #293631;
  --muted: #5A6861;
  --border: #CBD1C9;
  --accent: #365B50;
  --hover: #E4EAE2;
  --good: #E0ECE1;
  --good-border: #6C9371;
  --bad: #F1E4DF;
  --bad-border: #AD7E6F;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.55 system-ui, "Segoe UI", sans-serif;
}
main {
  max-width: 820px;
  margin: 35px auto;
  padding: 0 16px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 28px;
}
h1 { margin: 0 0 6px; font-size: 29px; }
h2 { margin: 24px 0 18px; font-size: 23px; line-height: 1.35; }
.muted { color: var(--muted); }
.progress {
  height: 7px;
  margin: 18px 0;
  overflow: hidden;
  background: #E1E5DF;
  border-radius: 8px;
}
.bar { height: 100%; background: #789588; }
button {
  width: 100%;
  margin: 8px 0;
  padding: 12px 16px;
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  background: #FFFEFA;
  border: 1px solid var(--border);
  border-radius: 9px;
}
button:hover {
  background: var(--hover);
  border-color: #879C8E;
}
button:focus {
  outline: 3px solid #547E71;
  outline-offset: 2px;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}
button.primary {
  color: white;
  text-align: center;
  background: var(--accent);
  border-color: var(--accent);
}
button.primary:hover { background: #29493F; }
.letter {
  display: inline-block;
  width: 31px;
  font-weight: 700;
}
.feedback {
  margin-top: 18px;
  padding: 12px 15px;
  border-radius: 9px;
}
.good {
  background: var(--good);
  border: 1px solid var(--good-border);
}
.bad {
  background: var(--bad);
  border: 1px solid var(--bad-border);
}
.selected-wrong { border: 2px solid var(--bad-border); }
.selected-right { border: 2px solid var(--good-border); }
.review {
  padding: 15px 0;
  border-top: 1px solid var(--border);
}
.answer {
  color: #315D43;
  font-weight: 700;
}
@media (max-width: 550px) {
  main { margin: 16px auto; }
  .card { padding: 20px; }
  h1 { font-size: 25px; }
  h2 { font-size: 20px; }
}
</style>
</head>

<body>
<main>
  <div class="card" id="app"></div>
</main>

<script>
const allQuestions = [
  {
    question: "The 13 stripes on the US flag represent __________.",
    options: ["the 13 original colonies", "the first 13 presidents", "the 13 largest states", "the 13 national parks"],
    answer: "the 13 original colonies"
  },
  {
    question: "The stars on the US flag represent __________.",
    options: ["the states", "the original colonies", "American cities", "the presidents of the USA"],
    answer: "the states"
  },
  {
    question: "Which two states are separated from the mainland USA?",
    options: ["Alaska and Hawaii", "Florida and Texas", "California and Alaska", "Hawaii and Washington"],
    answer: "Alaska and Hawaii"
  },
  {
    question: "The letters D.C. in Washington, D.C. stand for __________.",
    options: ["District of Columbia", "Democratic Capital", "Department of Congress", "District of California"],
    answer: "District of Columbia"
  },
  {
    question: "Which of these is a US territory?",
    options: ["Puerto Rico", "Greenland", "Bermuda", "Jamaica"],
    answer: "Puerto Rico"
  },
  {
    question: "The national bird of the USA is the __________.",
    options: ["bald eagle", "golden eagle", "peregrine falcon", "snowy owl"],
    answer: "bald eagle"
  },
  {
    question: "The national mammal of the USA is the __________.",
    options: ["beaver", "bison", "moose", "grizzly bear"],
    answer: "bison"
  },
  {
    question: "The highest mountain in the USA is __________.",
    options: ["Denali", "Mount Logan", "Aoraki / Mount Cook", "Mount Whitney"],
    answer: "Denali"
  },
  {
    question: "Denali is located in __________.",
    options: ["Alaska", "Arizona", "Colorado", "California"],
    answer: "Alaska"
  },
  {
    question: "The official currency of the USA is the __________.",
    options: ["American dollar", "pound sterling", "euro", "Canadian dollar"],
    answer: "American dollar"
  },
  {
    question: "Americans drive on the __________ side of the road.",
    options: ["right", "left", "middle", "opposite"],
    answer: "right"
  },
  {
    question: "America is named after the explorer __________.",
    options: ["Columbus", "Cook", "Vespucci", "Magellan"],
    answer: "Vespucci"
  },
  {
    question: "The first permanent English settlement in America was called __________.",
    options: ["Jamestown", "Plymouth", "New Amsterdam", "Boston"],
    answer: "Jamestown"
  },
  {
    question: "Thanksgiving originally commemorates __________.",
    options: [
      "the help given by Native Americans to English colonists, including knowledge about growing food",
      "the first victory of the American army over Britain",
      "the arrival of the first European settlers in New York",
      "the signing of the Declaration of Independence"
    ],
    answer: "the help given by Native Americans to English colonists, including knowledge about growing food"
  },
  {
    question: "The American holiday connected with a harvest celebration and the help given by Native Americans to early English colonists is __________.",
    options: ["Memorial Day", "Thanksgiving", "Independence Day", "Labor Day"],
    answer: "Thanksgiving"
  },
  {
    question: "Independence Day celebrates the anniversary of __________.",
    options: [
      "the signing of the Declaration of Independence",
      "the election of the first American president",
      "the end of the American Civil War",
      "the adoption of the US Constitution"
    ],
    answer: "the signing of the Declaration of Independence"
  },
  {
    question: "The first president of the United States was __________.",
    options: ["George Washington", "Abraham Lincoln", "Thomas Jefferson", "John Adams"],
    answer: "George Washington"
  },
  {
    question: "The Declaration of Independence declared independence from __________.",
    options: ["Great Britain", "France", "Spain", "Canada"],
    answer: "Great Britain"
  },
  {
    question: "The 13th Amendment to the US Constitution abolished __________.",
    options: ["slavery", "elections", "immigration", "taxation"],
    answer: "slavery"
  },
  {
    question: "The attack on Pearl Harbor led the USA to enter __________.",
    options: ["World War II", "World War I", "the Civil War", "the Vietnam War"],
    answer: "World War II"
  },
  {
    question: "John F. Kennedy was assassinated in __________.",
    options: ["Dallas", "New York City", "Washington, D.C.", "Los Angeles"],
    answer: "Dallas"
  },
  {
    question: "Martin Luther King Jr. was a famous American civil rights leader who fought especially for __________.",
    options: [
      "equal rights for Black Americans",
      "voting rights for women",
      "independence for the American colonies",
      "workers’ rights in factories"
    ],
    answer: "equal rights for Black Americans"
  },
  {
    question: "Which American civil rights leader fought for racial equality and delivered the ‘I Have a Dream’ speech?",
    options: ["Malcolm X", "Martin Luther King Jr.", "Rosa Parks", "Frederick Douglass"],
    answer: "Martin Luther King Jr."
  },
  {
    question: "Neil Armstrong was the first person to __________.",
    options: [
      "walk on the Moon",
      "fly across the Atlantic Ocean",
      "become president of the USA",
      "reach the North Pole"
    ],
    answer: "walk on the Moon"
  },
  {
    question: "Which astronaut was the first person to walk on the Moon?",
    options: ["Buzz Aldrin", "Michael Collins", "Neil Armstrong", "John Glenn"],
    answer: "Neil Armstrong"
  },
  {
    question: "The terrorist attacks of 11 September 2001 destroyed the Twin Towers of the __________.",
    options: ["World Trade Center", "White House", "Pentagon", "Capitol Building"],
    answer: "World Trade Center"
  },
  {
    question: "Grand Canyon National Park is in __________.",
    options: ["Arizona", "Nevada", "Texas", "Utah"],
    answer: "Arizona"
  },
  {
    question: "The Grand Canyon was carved by the __________ River.",
    options: ["Colorado", "Mississippi", "Missouri", "Hudson"],
    answer: "Colorado"
  },
  {
    question: "The famous bridge in San Francisco is called __________.",
    options: ["Golden Gate Bridge", "Brooklyn Bridge", "Tower Bridge", "Harbour Bridge"],
    answer: "Golden Gate Bridge"
  },
  {
    question: "Mount Rushmore shows the faces of four American __________.",
    options: ["presidents", "astronauts", "writers", "soldiers"],
    answer: "presidents"
  },
  {
    question: "The Liberty Bell is in __________.",
    options: ["Philadelphia", "Boston", "Chicago", "Seattle"],
    answer: "Philadelphia"
  },
  {
    question: "What was the name of the former maximum-security federal prison on an island in San Francisco Bay?",
    options: ["Alcatraz", "Sing Sing", "Rikers Island", "San Quentin"],
    answer: "Alcatraz"
  },
  {
    question: "The official residence of the US president is __________.",
    options: ["the White House", "the Capitol", "the Pentagon", "the Supreme Court"],
    answer: "the White House"
  },
  {
    question: "The Statue of Liberty is in __________.",
    options: ["New York", "Washington, D.C.", "Philadelphia", "Boston"],
    answer: "New York"
  },
  {
    question: "The Statue of Liberty was a gift from __________.",
    options: ["France", "Spain", "Italy", "the United Kingdom"],
    answer: "France"
  },
    {
    question: "Which monument in South Dakota features the carved faces of George Washington, Thomas Jefferson, Theodore Roosevelt and Abraham Lincoln?",
    options: ["Mount Rushmore", "the Statue of Liberty", "the Liberty Bell", "the Washington Monument"],
    answer: "Mount Rushmore"
  },
  {
    question: "The current President of the United States is __________.",
    options: ["Donald Trump", "Joe Biden", "Barack Obama", "George W. Bush"],
    answer: "Donald Trump"
  },
  {
    question: "The current Vice President of the United States is __________.",
    options: ["J.D. Vance", "Kamala Harris", "Mike Pence", "Al Gore"],
    answer: "J.D. Vance"
  },
  {
    question: "The longest-running scripted American primetime television series is __________.",
    options: ["The Simpsons", "Friends", "Saturday Night Live", "The Oprah Winfrey Show"],
    answer: "The Simpsons"
  },
  {
    question: "Which American mathematician worked for NASA and helped calculate flight paths for early space missions and the Moon landing?",
    options: ["Katherine Johnson", "Marie Curie", "Rosalind Franklin", "Ada Lovelace"],
    answer: "Katherine Johnson"
  },
    {
    question: "Where is the Empire State Building?",
    options: ["New York City", "Chicago", "Los Angeles", "Washington, D.C."],
    answer: "New York City"
  },
  {
    question: "Which US state is Death Valley in?",
    options: ["California", "Nevada", "Arizona", "Texas"],
    answer: "California"
  },
  {
    question: "What is the lowest point in the USA?",
    options: ["Death Valley", "Grand Canyon", "Mount Whitney", "Great Salt Lake"],
    answer: "Death Valley"
  },
  {
    question: "What is the capital of New York State?",
    options: ["Albany", "New York City", "Buffalo", "Syracuse"],
    answer: "Albany"
  },
  {
    question: "What is the capital of California?",
    options: ["Sacramento", "Los Angeles", "San Francisco", "San Diego"],
    answer: "Sacramento"
  },
  {
    question: "What is the capital of Texas?",
    options: ["Austin", "Houston", "Dallas", "San Antonio"],
    answer: "Austin"
  },
  {
    question: "What is the largest state in the USA?",
    options: ["Alaska", "Texas", "California", "Montana"],
    answer: "Alaska"
  },
  {
    question: "What is the most populous state in the USA?",
    options: ["California", "Texas", "Florida", "New York"],
    answer: "California"
  },
  {
    question: "Which state is known as the Sunshine State?",
    options: ["Florida", "California", "Hawaii", "Arizona"],
    answer: "Florida"
  },
  {
    question: "Which state is known as the Golden State?",
    options: ["California", "Florida", "Nevada", "Texas"],
    answer: "California"
  },
  {
    question: "Which US city is known as the Windy City?",
    options: ["Chicago", "New York City", "Boston", "Seattle"],
    answer: "Chicago"
  },
  {
    question: "Which city is known as the “Big Apple”?",
    options: ["New York City", "Los Angeles", "Chicago", "San Francisco"],
    answer: "New York City"
  },
  {
    question: "Which monument is located in New York Harbor?",
    options: ["the Statue of Liberty", "the Washington Monument", "Mount Rushmore", "the Liberty Bell"],
    answer: "the Statue of Liberty"
  },
  {
    question: "Which famous skyscraper is in New York City?",
    options: ["the Empire State Building", "the Willis Tower", "the Space Needle", "the Gateway Arch"],
    answer: "the Empire State Building"
  },
  {
    question: "Which city is home to the Hollywood Sign?",
    options: ["Los Angeles", "Las Vegas", "New York City", "San Francisco"],
    answer: "Los Angeles"
  },
  {
    question: "Which national monument has four presidents carved into it?",
    options: ["Mount Rushmore", "the Statue of Liberty", "the Liberty Bell", "the Golden Gate Bridge"],
    answer: "Mount Rushmore"
  },
  {
    question: "Which US monument is associated with the words “Give me your tired, your poor”?",
    options: ["the Statue of Liberty", "the Washington Monument", "the Lincoln Memorial", "Mount Rushmore"],
    answer: "the Statue of Liberty"
  },
  {
    question: "Which national park is famous for geysers and Old Faithful?",
    options: ["Yellowstone National Park", "Grand Canyon National Park", "Yosemite National Park", "Death Valley National Park"],
    answer: "Yellowstone National Park"
  },
  {
    question: "Who is shown on the five-dollar bill?",
    options: ["Abraham Lincoln", "George Washington", "Thomas Jefferson", "Benjamin Franklin"],
    answer: "Abraham Lincoln"
  },
  {
    question: "Who is shown on the one-dollar bill?",
    options: ["George Washington", "Abraham Lincoln", "Thomas Jefferson", "Theodore Roosevelt"],
    answer: "George Washington"
  },
  {
    question: "Who was the 16th president of the USA?",
    options: ["Abraham Lincoln", "George Washington", "Theodore Roosevelt", "Thomas Jefferson"],
    answer: "Abraham Lincoln"
  },
  {
    question: "Which US president is associated with the Emancipation Proclamation?",
    options: ["Abraham Lincoln", "George Washington", "John F. Kennedy", "Ronald Reagan"],
    answer: "Abraham Lincoln"
  },
  {
    question: "Which president appears on Mount Rushmore and was the third US president?",
    options: ["Thomas Jefferson", "George Washington", "Theodore Roosevelt", "Abraham Lincoln"],
    answer: "Thomas Jefferson"
  },
  {
    question: "What is the capital of the United States?",
    options: ["Washington, D.C.", "New York City", "Los Angeles", "Chicago"],
    answer: "Washington, D.C."
  },
  {
    question: "Which rapper starred in the film “8 Mile”?",
    options: ["Eminem", "Snoop Dogg", "Jay-Z", "Dr. Dre"],
    answer: "Eminem"
  },
  {
    question: "Which American city is strongly associated with Hollywood and the film industry?",
    options: ["Los Angeles", "New York City", "Chicago", "Miami"],
    answer: "Los Angeles"
  },
  {
    question: "Which animated TV series is the longest-running scripted American primetime series?",
    options: ["The Simpsons", "Friends", "South Park", "Family Guy"],
    answer: "The Simpsons"
  },
  {
    question: "Which American inventor developed the practical electric light bulb?",
    options: ["Thomas Edison", "Alexander Graham Bell", "Nikola Tesla", "Benjamin Franklin"],
    answer: "Thomas Edison"
  },
  {
    question: "Which American singer is known as the “King of Pop”?",
    options: ["Michael Jackson", "Elvis Presley", "Prince", "Frank Sinatra"],
    answer: "Michael Jackson"
  },
  {
    question: "Which American singer is known as the “Queen of Pop”?",
    options: ["Madonna", "Beyoncé", "Taylor Swift", "Whitney Houston"],
    answer: "Madonna"
  }
];

let round = [];
let index = 0;
let score = 0;
let wrong = [];

const app = document.getElementById("app");

function shuffle(items) {
  return [...items].sort(() => Math.random() - 0.5);
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

function startQuiz(items = allQuestions) {
  round = shuffle(items);
  index = 0;
  score = 0;
  wrong = [];
  showQuestion();
}

function showQuestion() {
  const question = round[index];
  const options = shuffle(question.options);

  app.innerHTML = `
    <h1>USA Quiz</h1>
    <div class="muted">Question ${index + 1} of ${round.length}</div>
    <div class="progress">
      <div class="bar" style="width: ${(index / round.length) * 100}%"></div>
    </div>
    <h2>${escapeHtml(question.question)}</h2>
    <div id="options"></div>
    <div id="feedback" aria-live="polite"></div>
  `;

  const optionsBox = document.getElementById("options");

  options.forEach((option, optionIndex) => {
    const button = document.createElement("button");
    const letter = String.fromCharCode(65 + optionIndex);

    button.innerHTML = `
      <span class="letter">${letter}.</span>${escapeHtml(option)}
    `;

    button.addEventListener("click", () => {
      checkAnswer(option, button, question);
    });

    optionsBox.appendChild(button);
  });
}

function checkAnswer(selectedAnswer, selectedButton, question) {
  const buttons = [...document.querySelectorAll("#options button")];
  const feedback = document.getElementById("feedback");

  buttons.forEach(button => {
    button.disabled = true;
  });

  if (selectedAnswer === question.answer) {
    score += 1;
    selectedButton.classList.add("selected-right");
    feedback.className = "feedback good";
    feedback.textContent = "Correct. Well done!";

    setTimeout(nextQuestion, 1000);
    return;
  }

  selectedButton.classList.add("selected-wrong");
  wrong.push(question);

  feedback.className = "feedback bad";
  feedback.innerHTML = `
    Incorrect. The correct answer is:
    <strong>${escapeHtml(question.answer)}</strong>.
  `;

  const okButton = document.createElement("button");
  okButton.className = "primary";
  okButton.textContent = "OK";
  okButton.addEventListener("click", nextQuestion);

  feedback.appendChild(okButton);
}

function nextQuestion() {
  index += 1;

  if (index < round.length) {
    showQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  app.innerHTML = `
    <h1>Round complete</h1>
    <p>You answered <strong>${score}</strong> out of <strong>${round.length}</strong> questions correctly.</p>

    <div class="actions">
      <button class="primary" id="restart">Zacznij od nowa</button>
      <button class="primary" id="repeat">Powtórz quiz — pytania do poprawy</button>
      <button class="primary" id="review">Wyświetl listę wiedzy do powtórzenia</button>
    </div>
  `;

  document.getElementById("restart").addEventListener("click", () => {
    startQuiz(allQuestions);
  });

  document.getElementById("repeat").addEventListener("click", () => {
    startQuiz(wrong);
  });

  document.getElementById("review").addEventListener("click", showReview);

  if (wrong.length === 0) {
    document.getElementById("repeat").disabled = true;
    document.getElementById("review").disabled = true;

    app.insertAdjacentHTML(
      "beforeend",
      `<p class="feedback good">Nie ma pytań do poprawy.</p>`
    );
  }
}

function showReview() {
  const reviewItems = wrong.map((question, reviewIndex) => `
    <div class="review">
      <strong>${reviewIndex + 1}. ${escapeHtml(question.question)}</strong><br>
      <span class="answer">Correct answer: ${escapeHtml(question.answer)}</span>
    </div>
  `).join("");

  app.innerHTML = `
    <h1>Wiedza do powtórzenia</h1>
    ${reviewItems}
    <button class="primary" id="back">Wróć do wyniku</button>
  `;

  document.getElementById("back").addEventListener("click", showResults);
}

startQuiz();
</script>
</body>
</html>
